<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena Registration</title>
    <!-- cinzel font from google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="card">
        <h1>Athena Registration</h1>
        <div class="progress"><div id="bar"></div></div>
        <form id="form">
            <div class="step active">
                <h2>Step 1 - Account</h2>
                <label>First Name<input id="fname"></label>
                <label>Last Name<input id="lname"></label>
                <label>Email<input id="email" type="email"></label>
                <button type="button" id="n1">Next</button>
            </div>
            <div class="step">
                <h2>Step 2 - Personal</h2>
                <label>Phone<input id="phone"></label>
                <label>Date of Birth<input id="dob" type="date"></label>
                <label>Favourite Coffee<input id="coffee"></label>
                <button type="button" class="back">Back</button>
                <button type="button" id="n2">Next</button>
            </div>
            <div class="step">
                <h2>Step 3 - Security</h2>
                <label>Password<input id="pass" type="password"></label>
                <label>Confirm Password<input id="confirm" type="password"></label>
                <label><input id="terms" type="checkbox"> I agree to the terms</label>
                <button type="button" class="back">Back</button>
                <button type="button" id="register">Register</button>
            </div>
        </form>
        <div id="login" class="hidden">
            <h2>Registration Successful</h2>
            <label>Email<input id="loginEmail"></label>
            <label>Password<input id="loginPass" type="password"></label>
            <button id="loginBtn">Login</button>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
